name: Xclense Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  macos-bundle:
    name: Build macOS bundle and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Alpha and beta tags publish as pre-releases so they never take the
          # "Latest" slot from a shipped stable build.
          case "$TAG" in
            *-alpha.*) echo "channel=Alpha"  >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *-beta.*)  echo "channel=Beta"   >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)         echo "channel=Stable" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify tag matches the version in every manifest
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$TAURI" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Tag $VERSION does not match manifests (package.json=$PKG tauri=$TAURI cargo=$CARGO)"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both are required for the universal binary that supports Intel Macs.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: yarn install --immutable

      # Apple's notarization API takes a key file, not an env var. Written to
      # the runner's temp dir (wiped with the runner) rather than the workspace,
      # so it can never be picked up by the bundler or committed.
      - name: Stage the App Store Connect API key
        id: apple
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # Read through the environment, never interpolated into the script
          # body — a secret on a command line ends up in traces and breaks on
          # any quote it happens to contain.
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"
          fi
          # Distinguishes a signed release build from the unsigned fallback.
          if [ -n "$CERT_B64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE is not set — publishing an ad-hoc signed build. macOS 15+ blocks these behind System Settings ➔ Privacy & Security ➔ Open Anyway. See docs/macos-code-signing.md."
          fi

      - name: Build Tauri bundle
        env:
          # Signs the updater artifacts. Without these the .app.tar.gz.sig is
          # not produced and installed clients reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Gatekeeper signing, staged under neutral names. These MUST NOT be
          # exported as APPLE_* here: an unset GitHub secret interpolates to the
          # empty string, not to nothing, and Tauri branches on whether
          # APPLE_CERTIFICATE is *defined* rather than whether it is non-empty.
          # Defining it as "" made the bundler run `security import` on empty
          # data and abort the whole build with "failed to import keychain
          # certificate" — the release simply never published.
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_PATH: ${{ steps.apple.outputs.key_path }}
        run: |
          # Export the APPLE_* names only when there is a real value behind
          # them, so an unconfigured repo builds ad-hoc instead of failing.
          if [ -n "$CERT_B64" ]; then
            export APPLE_CERTIFICATE="$CERT_B64"
            export APPLE_CERTIFICATE_PASSWORD="$CERT_PASSWORD"
            [ -n "$SIGNING_IDENTITY" ] && export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
            echo "Signing with a Developer ID certificate."
          else
            echo "No certificate configured — building ad-hoc."
          fi

          # Notarization needs all three or none; a partial set fails late, in
          # Apple's service, rather than here.
          if [ -n "$API_ISSUER" ] && [ -n "$API_KEY" ] && [ -n "$API_KEY_PATH" ]; then
            export APPLE_API_ISSUER="$API_ISSUER"
            export APPLE_API_KEY="$API_KEY"
            export APPLE_API_KEY_PATH="$API_KEY_PATH"
            echo "Notarization credentials present."
          fi

          yarn tauri build --target universal-apple-darwin

      # Signing failures are silent in the worst way: the bundle still builds,
      # the release still publishes, and only the tester finds out. Assert the
      # signature actually matches what the secrets promised.
      - name: Verify code signature and notarization
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Xclense.app"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign.txt

          if [ "${{ steps.apple.outputs.signed }}" != "true" ]; then
            echo "::notice::Ad-hoc signed build (no Developer ID secrets configured)."
            exit 0
          fi

          grep -q "TeamIdentifier=not set" /tmp/codesign.txt \
            && { echo "::error::APPLE_CERTIFICATE was set but the bundle is still ad-hoc signed — the certificate did not import."; exit 1; }
          grep -q "flags=.*runtime" /tmp/codesign.txt \
            || { echo "::error::Hardened runtime is not enabled — notarization will reject this bundle."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP" \
            || { echo "::error::Code signature does not verify."; exit 1; }

          # Gatekeeper's own verdict. This is the check that corresponds to what
          # a tester sees on first launch.
          spctl -a -vvv -t exec "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "accepted" /tmp/spctl.txt \
            || { echo "::error::Gatekeeper rejects this bundle — notarization did not complete."; exit 1; }
          echo "::notice::Signed, hardened, and accepted by Gatekeeper."

      - name: Verify the bundle carries the app icon
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Xclense.app"
          test -f "$APP/Contents/Resources/icon.icns" \
            || { echo "::error::Bundle is missing Resources/icon.icns — check bundle.icon in tauri.conf.json"; exit 1; }
          plutil -p "$APP/Contents/Info.plist" | grep -q CFBundleIconFile \
            || { echo "::error::Info.plist has no CFBundleIconFile"; exit 1; }

      - name: Locate the DMG and updater artifacts
        id: dmg
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          DMG=$(ls $BUNDLE/dmg/*.dmg | head -1)
          TARBALL=$(ls $BUNDLE/macos/*.app.tar.gz | head -1)
          SIGFILE=$(ls $BUNDLE/macos/*.app.tar.gz.sig | head -1)
          test -n "$TARBALL" && test -n "$SIGFILE" \
            || { echo "::error::Updater artifacts missing — is createUpdaterArtifacts enabled and the signing key set?"; exit 1; }
          # A universal binary must carry both slices, or Intel users get a
          # bundle that cannot launch while the release looks correct.
          lipo -archs "$BUNDLE/macos/Xclense.app/Contents/MacOS/Xclense" | tee /tmp/archs
          grep -q "x86_64" /tmp/archs && grep -q "arm64" /tmp/archs \
            || { echo "::error::Bundle is not universal — expected both x86_64 and arm64 slices"; exit 1; }
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sigfile=$SIGFILE" >> "$GITHUB_OUTPUT"
          echo "Built: $DMG"
          echo "Updater: $TARBALL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          DMG="${{ steps.dmg.outputs.path }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # The maintainer may already have published this release by hand from
          # a local build (see .claude/skills/release-manager/SKILL.md). Attach
          # to the existing release rather than failing the run.
          TARBALL="${{ steps.dmg.outputs.tarball }}"
          SIGFILE="${{ steps.dmg.outputs.sigfile }}"

          REPO="${{ github.repository }}"

          # A `gh release create` that dies mid-flight (GitHub 503s during asset
          # upload are not rare) leaves the release behind as a DRAFT with some
          # or all assets attached. Retrying `create` then fails with "already
          # exists", and a draft is invisible to the updater. Treat "exists in
          # any state" as the resumable case and always converge on published.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — resuming."
            gh release upload "$TAG" "$DMG" "$TARBALL" "$SIGFILE" --clobber --repo "$REPO"
          else
            for attempt in 1 2 3; do
              gh release create "$TAG" "$DMG" "$TARBALL" "$SIGFILE" \
                --title "$TAG — ${{ steps.meta.outputs.channel }} Release" \
                --notes-file RELEASE_NOTES.md \
                $PRERELEASE_FLAG \
                --repo "$REPO" && break
              echo "::warning::Attempt $attempt to publish $TAG failed."
              if [ "$attempt" = 3 ]; then
                echo "::error::Could not publish $TAG after 3 attempts."
                exit 1
              fi
              # A failed create may still have created the release; from here on
              # the resume path is the correct one.
              sleep $((attempt * 15))
              if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                gh release upload "$TAG" "$DMG" "$TARBALL" "$SIGFILE" --clobber --repo "$REPO"
                break
              fi
            done
          fi

          # Converge on the intended final state regardless of how we got here.
          gh release edit "$TAG" --repo "$REPO" \
            --draft=false --prerelease=${{ steps.meta.outputs.prerelease }}

          # Assert it, rather than trusting that the edit took.
          STATE=$(gh release view "$TAG" --repo "$REPO" --json isDraft,isPrerelease,assets)
          echo "$STATE"
          [ "$(echo "$STATE" | jq -r .isDraft)" = "false" ] \
            || { echo "::error::$TAG is still a draft — the updater cannot see it."; exit 1; }
          [ "$(echo "$STATE" | jq -r .isPrerelease)" = "${{ steps.meta.outputs.prerelease }}" ] \
            || { echo "::error::$TAG has the wrong prerelease flag."; exit 1; }
          COUNT=$(echo "$STATE" | jq '[.assets[].name] | length')
          [ "$COUNT" -ge 3 ] \
            || { echo "::error::$TAG has $COUNT assets, expected the dmg, tarball and sig."; exit 1; }

      # The OTA endpoint is a static file on main rather than the release
      # "latest" URL, because GitHub excludes pre-releases from that URL and
      # every alpha/beta build is a pre-release.
      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SIGNATURE=$(cat "${{ steps.dmg.outputs.sigfile }}")
          TARBALL_NAME=$(basename "${{ steps.dmg.outputs.tarball }}")
          REPO_URL="https://github.com/${{ github.repository }}"
          PAYLOAD_URL="$REPO_URL/releases/download/$TAG/$TARBALL_NAME"

          # Publishing a manifest that points at an unreachable payload breaks
          # every installed client at once, and nothing about the release page
          # would look wrong. Prove the URL resolves for an anonymous client
          # (no token) before the manifest starts advertising it.
          echo "Probing $PAYLOAD_URL as an unauthenticated client..."
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 "$PAYLOAD_URL" || echo 000)
            [ "$CODE" = "200" ] && break
            echo "  attempt $attempt: HTTP $CODE"
            [ "$attempt" = 5 ] && {
              echo "::error::Update payload is not publicly downloadable (HTTP $CODE). A private repo or a missing asset makes OTA impossible."
              exit 1
            }
            sleep 15
          done
          echo "Payload is publicly reachable."

          mkdir -p updates
          cat > updates/latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "See $REPO_URL/releases/tag/$TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIGNATURE",
                "url": "$REPO_URL/releases/download/$TAG/$TARBALL_NAME"
              },
              "darwin-x86_64": {
                "signature": "$SIGNATURE",
                "url": "$REPO_URL/releases/download/$TAG/$TARBALL_NAME"
              }
            }
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add updates/latest.json
          if git diff --staged --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "chore(updates): publish $TAG update manifest [skip ci]"
            git push origin main
          fi

      # raw.githubusercontent is CDN-cached for roughly five minutes, so a run
      # can finish green while every client still receives the previous
      # manifest. Waiting here means "release succeeded" and "clients can see
      # it" mean the same thing, instead of the maintainer having to remember
      # to re-check by hand.
      - name: Wait for the update endpoint to serve the new version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ENDPOINT=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.endpoints[0]")
          echo "Endpoint: $ENDPOINT"

          for attempt in $(seq 1 20); do
            SERVED=$(curl -sS --max-time 30 "$ENDPOINT" | jq -r .version 2>/dev/null || echo "")
            if [ "$SERVED" = "$VERSION" ]; then
              echo "::notice::Update endpoint is serving $VERSION after $((attempt * 30))s."
              exit 0
            fi
            echo "  attempt $attempt: endpoint still serving '${SERVED:-<unreadable>}'"
            sleep 30
          done

          # The commit is on main either way, so this is a propagation delay
          # rather than a broken release — say so instead of failing the run.
          echo "::warning::Endpoint still not serving $VERSION after 10 minutes. The manifest is committed to main; this is CDN cache lag and should clear on its own."
