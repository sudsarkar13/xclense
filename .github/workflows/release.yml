name: Xclense Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.2.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  macos-bundle:
    name: Build macOS bundle and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Alpha and beta tags publish as pre-releases so they never take the
          # "Latest" slot from a shipped stable build.
          case "$TAG" in
            *-alpha.*) echo "channel=Alpha"  >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *-beta.*)  echo "channel=Beta"   >> "$GITHUB_OUTPUT"; echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)         echo "channel=Stable" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify tag matches the version in every manifest
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$TAURI" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Tag $VERSION does not match manifests (package.json=$PKG tauri=$TAURI cargo=$CARGO)"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Tauri bundle
        env:
          # Signs the updater artifacts. Without these the .app.tar.gz.sig is
          # not produced and installed clients reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build

      - name: Verify the bundle carries the app icon
        run: |
          APP="src-tauri/target/release/bundle/macos/Xclense.app"
          test -f "$APP/Contents/Resources/icon.icns" \
            || { echo "::error::Bundle is missing Resources/icon.icns — check bundle.icon in tauri.conf.json"; exit 1; }
          plutil -p "$APP/Contents/Info.plist" | grep -q CFBundleIconFile \
            || { echo "::error::Info.plist has no CFBundleIconFile"; exit 1; }

      - name: Locate the DMG and updater artifacts
        id: dmg
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          TARBALL=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz | head -1)
          SIGFILE=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz.sig | head -1)
          test -n "$TARBALL" && test -n "$SIGFILE" \
            || { echo "::error::Updater artifacts missing — is createUpdaterArtifacts enabled and the signing key set?"; exit 1; }
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sigfile=$SIGFILE" >> "$GITHUB_OUTPUT"
          echo "Built: $DMG"
          echo "Updater: $TARBALL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          DMG="${{ steps.dmg.outputs.path }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # The maintainer may already have published this release by hand from
          # a local build (see .claude/skills/release-manager/SKILL.md). Attach
          # to the existing release rather than failing the run.
          TARBALL="${{ steps.dmg.outputs.tarball }}"
          SIGFILE="${{ steps.dmg.outputs.sigfile }}"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading bundles to it."
            gh release upload "$TAG" "$DMG" "$TARBALL" "$SIGFILE" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$DMG" "$TARBALL" "$SIGFILE" \
              --title "$TAG — ${{ steps.meta.outputs.channel }} Release" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG \
              --repo "${{ github.repository }}"
          fi

      # The OTA endpoint is a static file on main rather than the release
      # "latest" URL, because GitHub excludes pre-releases from that URL and
      # every alpha/beta build is a pre-release.
      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SIGNATURE=$(cat "${{ steps.dmg.outputs.sigfile }}")
          TARBALL_NAME=$(basename "${{ steps.dmg.outputs.tarball }}")
          REPO_URL="https://github.com/${{ github.repository }}"

          mkdir -p updates
          cat > updates/latest.json <<JSON
          {
            "version": "$VERSION",
            "notes": "See $REPO_URL/releases/tag/$TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIGNATURE",
                "url": "$REPO_URL/releases/download/$TAG/$TARBALL_NAME"
              }
            }
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git add updates/latest.json
          if git diff --staged --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "chore(updates): publish $TAG update manifest [skip ci]"
            git push origin main
          fi
